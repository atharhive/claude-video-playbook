<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="specBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08070F"/>
      <stop offset="100%" stop-color="#140E1F"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#specBg)" stroke="#372D4A" stroke-width="2"/>

  <!-- Frequency Grid -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="740" y2="80"/>
    <line x1="80" y1="160" x2="740" y2="160"/>
    <line x1="80" y1="240" x2="740" y2="240"/>
    <line x1="80" y1="320" x2="740" y2="320"/>
    <line x1="80" y1="400" x2="740" y2="400"/>
    <line x1="200" y1="40" x2="200" y2="440"/>
    <line x1="360" y1="40" x2="360" y2="440"/>
    <line x1="520" y1="40" x2="520" y2="440"/>
    <line x1="680" y1="40" x2="680" y2="440"/>
  </g>

  <!-- Axis Labels -->
  <text x="30" y="85" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">400Hz</text>
  <text x="30" y="245" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">200Hz</text>
  <text x="30" y="405" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">60Hz</text>

  <text x="80" y="465" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">00:00</text>
  <text x="360" y="465" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">t_CPA (Closest Approach)</text>
  <text x="680" y="465" fill="#8E85A2" font-family="'JetBrains Mono', monospace" font-size="12">01:00</text>

  <!-- Ambient noise background fuzz -->
  <g opacity="0.25" stroke="#4C1D95" stroke-width="1">
    <path d="M 80 280 Q 200 290 300 270 T 500 290 T 740 280" fill="none"/>
    <path d="M 80 180 Q 220 170 340 190 T 580 175 T 740 185" fill="none"/>
  </g>

  <!-- Doppler Ridge Curves (Harmonics k=1, k=2) -->
  <!-- Primary Tone -->
  <path d="M 100 200 C 260 205, 340 220, 390 280 C 440 340, 520 360, 720 365" fill="none" stroke="url(#ridge)" stroke-width="6" stroke-linecap="round"/>
  <!-- 2nd Harmonic -->
  <path d="M 100 100 C 260 105, 340 115, 390 150 C 440 190, 520 205, 720 210" fill="none" stroke="url(#ridge)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- CPA Target Crosshair -->
  <circle cx="390" cy="280" r="16" fill="none" stroke="#F5C542" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="390" cy="280" r="4" fill="#EF4444"/>
  <line x1="390" y1="250" x2="390" y2="310" stroke="#F5C542" stroke-width="1.5"/>
  <line x1="360" y1="280" x2="420" y2="280" stroke="#F5C542" stroke-width="1.5"/>

  <!-- Info Callout -->
  <g transform="translate(420, 240)">
    <rect width="260" height="50" rx="6" fill="#1C1826" stroke="#4E3E66" stroke-width="1"/>
    <text x="14" y="22" fill="#F5C542" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CPA FREQUENCY DROP</text>
    <text x="14" y="38" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="11">Slant Range: 640m • v: 72 m/s</text>
  </g>
</svg>
