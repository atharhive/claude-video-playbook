<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0B1120; width: 1080px; height: 1200px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; position: relative; }
  
  /* Night sky with stars and moon */
  .sky { position: absolute; top: 0; left: 0; width: 100%; height: 600px; background: radial-gradient(circle at 80% 20%, #1E293B 0%, #0B1120 70%); }
  .moon { position: absolute; top: 70px; right: 120px; width: 60px; height: 60px; border-radius: 50%; box-shadow: -10px 8px 0 2px #FEF08A; }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.8; }
  
  /* Skyline */
  .skyline { position: absolute; top: 220px; left: 0; width: 100%; height: 420px; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 40px; }
  .bldg { background: #131D31; border: 2px solid #1E293B; border-bottom: none; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 14px 10px; }
  .win { width: 12px; height: 16px; background: #FEF08A; border-radius: 2px; box-shadow: 0 0 8px rgba(254,240,138,0.5); }
  .win.off { background: #0F172A; box-shadow: none; }
  
  /* Severed Cable Visual */
  .cable-container { position: absolute; top: 680px; width: 900px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .cable-half { width: 340px; height: 26px; background: #2563EB; border-radius: 13px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .plug { position: absolute; width: 50px; height: 44px; background: #475569; top: -9px; border-radius: 6px; border: 3px solid #334155; }
  .plug.left { right: 0; }
  .plug.right { left: 0; }
  
  /* Break & Sparks */
  .break-zone { width: 140px; height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .wifi-icon { font-size: 54px; color: #EF4444; position: relative; }
  .wifi-slash { position: absolute; width: 70px; height: 5px; background: #EF4444; transform: rotate(45deg); top: 28px; left: -8px; border-radius: 3px; box-shadow: 0 0 10px rgba(239,68,68,0.8); }
  .spark { position: absolute; width: 8px; height: 8px; background: #FBBF24; border-radius: 50%; box-shadow: 0 0 12px #FBBF24; }
</style>
</head>
<body>
  <div class="sky">
    <div class="moon"></div>
    <div class="star" style="top:90px; left:140px; width:4px; height:4px;"></div>
    <div class="star" style="top:140px; left:320px; width:3px; height:3px;"></div>
    <div class="star" style="top:60px; left:540px; width:5px; height:5px;"></div>
    <div class="star" style="top:180px; left:720px; width:4px; height:4px;"></div>
  </div>

  <div class="skyline">
    <div class="bldg" style="width:110px; height:280px;">
      <div class="win"></div><div class="win"></div><div class="win off"></div><div class="win"></div>
      <div class="win off"></div><div class="win"></div><div class="win"></div><div class="win off"></div>
      <div class="win"></div><div class="win off"></div><div class="win"></div><div class="win"></div>
    </div>
    <div class="bldg" style="width:140px; height:380px;">
      <div class="win"></div><div class="win"></div><div class="win"></div><div class="win off"></div>
      <div class="win off"></div><div class="win"></div><div class="win"></div><div class="win"></div>
      <div class="win"></div><div class="win off"></div><div class="win"></div><div class="win"></div>
    </div>
    <div class="bldg" style="width:120px; height:320px;">
      <div class="win off"></div><div class="win"></div><div class="win"></div><div class="win off"></div>
      <div class="win"></div><div class="win"></div><div class="win off"></div><div class="win"></div>
    </div>
    <div class="bldg" style="width:130px; height:240px;">
      <div class="win"></div><div class="win off"></div><div class="win"></div><div class="win"></div>
    </div>
  </div>

  <div class="cable-container">
    <div class="cable-half">
      <div class="plug left"></div>
    </div>
    <div class="break-zone">
      <div class="wifi-icon">
        📶
        <div class="wifi-slash"></div>
      </div>
      <div class="spark" style="top:25px; left:18px;"></div>
      <div class="spark" style="bottom:25px; right:20px;"></div>
      <div class="spark" style="top:60px; right:15px; width:6px; height:6px;"></div>
    </div>
    <div class="cable-half">
      <div class="plug right"></div>
    </div>
  </div>
</body>
</html>
