<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0F172A; width: 1080px; height: 1200px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; padding: 40px; }

  /* Repo Card (Exactly matching nomad_55.jpg) */
  .card { width: 900px; background: #FFFFFF; border-radius: 20px; border: 4px solid #1E293B; box-shadow: 0 20px 50px rgba(0,0,0,0.4); padding: 50px 60px; display: flex; flex-direction: column; gap: 20px; }
  .card-header { font-size: 20px; font-weight: 800; color: #64748B; text-transform: uppercase; letter-spacing: 0.12em; }
  .card-title { font-size: 68px; font-weight: 900; color: #0F172A; letter-spacing: -0.02em; }
  .card-desc { font-size: 28px; font-weight: 600; color: #475569; margin-bottom: 10px; }
  
  .badges { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
  .badge-stars { background: #FFFBEB; border: 2px solid #FDE68A; padding: 12px 28px; border-radius: 40px; font-size: 26px; font-weight: 800; color: #B45309; display: flex; align-items: center; gap: 10px; }
  .badge-offline { background: #DCFCE7; border: 2px solid #86EFAC; padding: 12px 28px; border-radius: 40px; font-size: 26px; font-weight: 900; color: #15803D; letter-spacing: 0.05em; }

  /* Features Grid */
  .features { width: 900px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 36px; }
  .feat-box { background: #1E293B; border: 2px solid #334155; border-radius: 14px; padding: 24px; text-align: center; }
  .feat-title { font-size: 22px; font-weight: 800; color: #F8FAFC; margin-bottom: 6px; }
  .feat-sub { font-size: 15px; color: #94A3B8; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">GITHUB REPO</div>
    <div class="card-title">project-nomad</div>
    <div class="card-desc">Knowledge that never goes offline</div>
    <div class="badges">
      <div class="badge-stars">⭐ 43,000+</div>
      <div class="badge-offline">OFFLINE</div>
    </div>
  </div>

  <div class="features">
    <div class="feat-box">
      <div class="feat-title">📚 Wikipedia</div>
      <div class="feat-sub">125 GB Full Kiwix Library</div>
    </div>
    <div class="feat-box">
      <div class="feat-title">🧠 Local AI</div>
      <div class="feat-sub">Ollama + Qdrant RAG</div>
    </div>
    <div class="feat-box">
      <div class="feat-title">🗺️ ProtoMaps</div>
      <div class="feat-sub">Offline Regional GIS</div>
    </div>
  </div>
</body>
</html>
