<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0F172A; width: 1080px; height: 1200px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; padding: 40px; }
  .card { width: 900px; background: #FFFFFF; border-radius: 20px; border: 4px solid #1E293B; box-shadow: 0 20px 50px rgba(0,0,0,0.4); padding: 50px 60px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .tag-pill { background: #DCFCE7; border: 2px solid #86EFAC; color: #15803D; font-size: 20px; font-weight: 800; padding: 8px 24px; border-radius: 30px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-title { font-size: 64px; font-weight: 900; color: #0F172A; }
  .card-sub { font-size: 24px; font-weight: 600; color: #475569; }
  .star-box { background: #FEF08A; border: 3px solid #EAB308; border-radius: 16px; padding: 24px 50px; font-size: 54px; font-weight: 900; color: #854D0E; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 24px rgba(234,179,8,0.3); }
  .cta-pin { background: #F1F5F9; border: 2px solid #CBD5E1; border-radius: 12px; padding: 18px 36px; font-size: 22px; font-weight: 700; color: #334155; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag-pill">APACHE 2.0 LICENSED · 100% FREE</div>
    <div class="card-title">Project NOMAD</div>
    <div class="card-sub">The Self-Contained Offline Survival Server</div>
    
    <div class="star-box">
      <span>⭐</span>
      <span>43,000+ STARS</span>
    </div>

    <div class="cta-pin">
      📌 <b>CHECK THE PINNED COMMENT</b> FOR GITHUB REPOSITORY & SETUP GUIDE
    </div>
  </div>
</body>
</html>
