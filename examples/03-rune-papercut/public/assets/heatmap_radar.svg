<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Base Map -->
  <rect width="800" height="500" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>

  <!-- Topographic Contour / Grid lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <circle cx="420" cy="250" r="80" fill="none"/>
    <circle cx="420" cy="250" r="160" fill="none"/>
    <circle cx="420" cy="250" r="240" fill="none"/>
    <line x1="420" y1="20" x2="420" y2="480"/>
    <line x1="60" y1="250" x2="760" y2="250"/>
  </g>

  <!-- Flight Track 1 (Cessna Skyhawk C172) -->
  <path d="M 120 80 L 700 380" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="340" cy="194" r="5" fill="#38BDF8"/>
  <text x="140" y="80" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">N4927V • 120 kts • 2,400 ft</text>

  <!-- Flight Track 2 (Piper PA-28) -->
  <path d="M 680 90 L 140 410" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="440" cy="232" r="5" fill="#10B981"/>
  <text x="520" y="90" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">N8103A • 115 kts • 3,100 ft</text>

  <!-- Probability Heatmap Bubble -->
  <circle cx="420" cy="245" r="90" fill="url(#radarSweep)"/>

  <!-- Target Pinpoint Marker -->
  <circle cx="420" cy="245" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="420" cy="245" r="4" fill="#EF4444"/>

  <!-- Pinpoint HUD Callout -->
  <g transform="translate(460, 265)">
    <rect width="280" height="64" rx="8" fill="#181424" stroke="#D97757" stroke-width="1.5"/>
    <text x="16" y="24" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">ACOUSTIC LOCK: 100M</text>
    <text x="16" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">Lat: 40.8715° N • Lon: -73.5321° W</text>
    <text x="16" y="56" fill="#A89FB8" font-family="'JetBrains Mono', monospace" font-size="10">Target Area: Oyster Bay, NY</text>
  </g>
</svg>
