<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cozy Cel-Animation Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const W = 1080, H = 1920;

    // Line boil seed & noise
    function boil(seed, t) {
      const step = Math.floor(t * 12) % 3;
      const x = Math.sin(seed * 99 + step * 37) * 1.6;
      const y = Math.cos(seed * 77 + step * 43) * 1.6;
      return [x, y];
    }

    // Snow particles
    const SNOW = [];
    for (let i = 0; i < 90; i++) {
      SNOW.push({
        x: 620 + Math.random() * 380,
        y: 260 + Math.random() * 560,
        r: 2.5 + Math.random() * 3.5,
        speed: 1.5 + Math.random() * 2.5,
        drift: (Math.random() - 0.5) * 1.2
      });
    }

    // --- DRAW BACKGROUND: COZY LIVING ROOM ---
    function drawLivingRoom(t) {
      // Room wall: deep warm mauve / eggplant
      ctx.fillStyle = '#261b2e';
      ctx.fillRect(0, 0, W, H);

      // Floor: warm rich chestnut parquet
      ctx.fillStyle = '#3a2218';
      ctx.fillRect(0, 1140, W, H - 1140);

      // Floor baseboard trim
      ctx.fillStyle = '#22140d';
      ctx.fillRect(0, 1120, W, 22);

      // Soft circular woven rug
      ctx.beginPath();
      ctx.ellipse(540, 1420, 480, 220, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#c7b49d';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#9e8972';
      ctx.stroke();

      // Inner rug pattern ring
      ctx.beginPath();
      ctx.ellipse(540, 1420, 420, 180, 0, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      ctx.strokeStyle = '#7c6955';
      ctx.stroke();
      ctx.setLineDash([]);

      // --- WINDOW (RIGHT SIDE) ---
      const wx = 620, wy = 260, ww = 380, wh = 560;
      // Window frame & wall sill
      ctx.fillStyle = '#17111c';
      ctx.fillRect(wx - 16, wy - 16, ww + 32, wh + 32);

      // Deep dark night outside window
      ctx.fillStyle = '#0a1024';
      ctx.fillRect(wx, wy, ww, wh);

      // Snow covered pines / hills silhouette outside
      ctx.fillStyle = '#060a17';
      ctx.beginPath();
      ctx.moveTo(wx, wy + wh);
      ctx.lineTo(wx, wy + 420);
      ctx.quadraticCurveTo(wx + 120, wy + 380, wx + 200, wy + 430);
      ctx.quadraticCurveTo(wx + 300, wy + 400, wx + ww, wy + 450);
      ctx.lineTo(wx + ww, wy + wh);
      ctx.closePath();
      ctx.fill();

      // Falling snow outside
      ctx.save();
      ctx.beginPath();
      ctx.rect(wx, wy, ww, wh);
      ctx.clip();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      SNOW.forEach(s => {
        const sy = (s.y + t * 60 * s.speed) % wh;
        const sx = wx + ((s.x - wx + Math.sin(t * 2 + s.r) * 15) % ww);
        ctx.beginPath();
        ctx.arc(sx, wy + sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // Window cross muntins
      ctx.fillStyle = '#2a2233';
      ctx.fillRect(wx + ww / 2 - 7, wy, 14, wh);
      ctx.fillRect(wx, wy + wh / 2 - 7, ww, 14);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#17111c';
      ctx.strokeRect(wx, wy, ww, wh);

      // --- FIREPLACE & CHIMNEY (LEFT SIDE) ---
      const fx = 70, fy = 480, fw = 280, fh = 660;
      // Brick chimney stack
      ctx.fillStyle = '#4e3328';
      ctx.fillRect(fx, fy, fw, fh);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#271710';
      ctx.strokeRect(fx, fy, fw, fh);

      // Mantelpiece ledge
      ctx.fillStyle = '#6b4636';
      ctx.fillRect(fx - 24, fy - 20, fw + 48, 32);
      ctx.strokeRect(fx - 24, fy - 20, fw + 48, 32);

      // Fireplace hearth cavity (arched)
      ctx.beginPath();
      ctx.moveTo(fx + 40, fy + fh);
      ctx.lineTo(fx + 40, fy + 380);
      ctx.quadraticCurveTo(fx + fw / 2, fy + 320, fx + fw - 40, fy + 380);
      ctx.lineTo(fx + fw - 40, fy + fh);
      ctx.closePath();
      ctx.fillStyle = '#140c08';
      ctx.fill();
      ctx.stroke();

      // Fire glow bloom
      const glow = ctx.createRadialGradient(fx + fw / 2, fy + fh - 80, 20, fx + fw / 2, fy + fh - 80, 320);
      glow.addColorStop(0, 'rgba(255, 120, 20, 0.55)');
      glow.addColorStop(0.5, 'rgba(255, 80, 0, 0.2)');
      glow.addColorStop(1, 'rgba(255, 60, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 400, 600, 800);

      // Fire logs
      ctx.fillStyle = '#2d180b';
      ctx.fillRect(fx + 55, fy + fh - 40, fw - 110, 30);

      // Animated cel-drawn flames
      const fStep = Math.sin(t * 18) * 12;
      ctx.fillStyle = '#ff3700';
      ctx.beginPath();
      ctx.moveTo(fx + 75, fy + fh - 35);
      ctx.quadraticCurveTo(fx + 100, fy + fh - 140 + fStep, fx + 130, fy + fh - 210 - fStep * 0.8);
      ctx.quadraticCurveTo(fx + 155, fy + fh - 130 + fStep * 0.5, fx + 180, fy + fh - 190 - fStep);
      ctx.quadraticCurveTo(fx + 210, fy + fh - 120, fx + 215, fy + fh - 35);
      ctx.closePath();
      ctx.fill();

      // Inner golden flame
      ctx.fillStyle = '#ffbb00';
      ctx.beginPath();
      ctx.moveTo(fx + 95, fy + fh - 35);
      ctx.quadraticCurveTo(fx + 120, fy + fh - 110 + fStep, fx + 140, fy + fh - 150 - fStep * 0.5);
      ctx.quadraticCurveTo(fx + 165, fy + fh - 90, fx + 190, fy + fh - 35);
      ctx.closePath();
      ctx.fill();

      // --- WIDE COZY SOFA (CENTER) ---
      const sx = 200, sy = 760, sw = 680, sh = 420;
      // Sofa backrest
      ctx.fillStyle = '#243b55';
      ctx.beginPath();
      ctx.roundRect(sx, sy, sw, 250, 40);
      ctx.fill();
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#141f2d';
      ctx.stroke();

      // Cushion seam line
      ctx.beginPath();
      ctx.moveTo(sx + sw / 2, sy + 30);
      ctx.lineTo(sx + sw / 2, sy + 250);
      ctx.strokeStyle = '#1b2c40';
      ctx.stroke();

      // Sofa seat cushion base
      ctx.fillStyle = '#2d496a';
      ctx.beginPath();
      ctx.roundRect(sx - 30, sy + 220, sw + 60, 160, 30);
      ctx.fill();
      ctx.strokeStyle = '#141f2d';
      ctx.stroke();

      // Sofa left & right armrests
      ctx.fillStyle = '#1e324a';
      ctx.beginPath();
      ctx.roundRect(sx - 55, sy + 180, 90, 200, 35);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(sx + sw - 35, sy + 180, 90, 200, 35);
      ctx.fill();
      ctx.stroke();
    }

    // --- CHARACTER 1: TEENAGER (From Pinterest Reference) ---
    // Pale cute face, black wavy parted bangs, huge fluffy cream scarf hiding chin, dark navy coat
    function drawTeenager(x, y, t, isSpeaking) {
      ctx.save();
      ctx.translate(x, y);

      const [bx, by] = boil(1, t);
      const bob = Math.sin(t * 14) * (isSpeaking ? 5 : 1.5);
      const look = Math.sin(t * 2) * 4;

      // 1. Navy Winter Coat & Sitting Legs
      ctx.fillStyle = '#172437';
      ctx.strokeStyle = '#0e1724';
      ctx.lineWidth = 6;

      // Sitting thigh / knees
      ctx.beginPath();
      ctx.roundRect(-100 + bx, 140, 90, 160, 25);
      ctx.roundRect(10 + bx, 140, 90, 160, 25);
      ctx.fill();
      ctx.stroke();

      // Torso / Jacket
      ctx.beginPath();
      ctx.roundRect(-120 + bx, -40 + bob * 0.4, 240, 200, 40);
      ctx.fill();
      ctx.stroke();

      // 2. Arms resting warmly on lap
      ctx.beginPath();
      ctx.roundRect(-135 + bx, 30 + bob * 0.3, 70, 120, 28);
      ctx.roundRect(65 + bx, 30 + bob * 0.3, 70, 120, 28);
      ctx.fill();
      ctx.stroke();

      // Pale cute hands peeking from sleeves
      ctx.fillStyle = '#fce4ce';
      ctx.beginPath();
      ctx.arc(-100 + bx, 150, 18, 0, Math.PI * 2);
      ctx.arc(100 + bx, 150, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 3. Head & Hair
      ctx.save();
      ctx.translate(0, -90 + bob);

      // (A) Hair Back Volume (Behind head)
      ctx.fillStyle = '#16161b';
      ctx.strokeStyle = '#0d0d12';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0 + bx, -15, 96, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // (B) Pale porcelain skin face
      ctx.fillStyle = '#ffead4';
      ctx.beginPath();
      ctx.ellipse(0 + bx, 10, 80, 75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#2b1b17';
      ctx.lineWidth = 4.5;
      ctx.stroke();

      // (C) Soft blushing cheeks (hallmark of reference)
      ctx.fillStyle = 'rgba(255, 110, 110, 0.65)';
      ctx.beginPath();
      ctx.ellipse(-46 + bx, 26, 20, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(46 + bx, 26, 20, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // (D) Cute big expressive cartoon eyes
      const blink = Math.sin(t * 3.5) > 0.94;
      if (!blink) {
        // Left eye
        ctx.fillStyle = '#1a181f';
        ctx.beginPath();
        ctx.ellipse(-34 + bx + look, 10, 11, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        // Eye catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-37 + bx + look, 5, 4, 0, Math.PI * 2);
        ctx.arc(-31 + bx + look, 14, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Right eye
        ctx.fillStyle = '#1a181f';
        ctx.beginPath();
        ctx.ellipse(34 + bx + look, 10, 11, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(31 + bx + look, 5, 4, 0, Math.PI * 2);
        ctx.arc(37 + bx + look, 14, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Cute upper eyeliner
        ctx.strokeStyle = '#1a181f';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(-34 + bx + look, 8, 14, Math.PI * 1.15, Math.PI * 1.85);
        ctx.arc(34 + bx + look, 8, 14, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      } else {
        // Closed smiling eye arcs
        ctx.strokeStyle = '#1a181f';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(-34 + bx, 14, 13, Math.PI * 0.15, Math.PI * 0.85);
        ctx.arc(34 + bx, 14, 13, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
      }

      // Petite nose
      ctx.fillStyle = '#e5ab91';
      ctx.beginPath();
      ctx.arc(0 + bx, 22, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Mouth (speaking lip sync or sweet smile)
      if (isSpeaking) {
        const mouthOpen = Math.abs(Math.sin(t * 16)) * 12 + 4;
        ctx.fillStyle = '#c43b4c';
        ctx.beginPath();
        ctx.ellipse(0 + bx, 38, 10, mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2b1b17';
        ctx.lineWidth = 3;
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#2b1b17';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0 + bx, 35, 9, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }

      // (E) Parted middle curtain bangs (drawn OVER forehead)
      ctx.fillStyle = '#16161b';
      ctx.strokeStyle = '#0d0d12';
      ctx.lineWidth = 4.5;

      // Left bangs
      ctx.beginPath();
      ctx.moveTo(-6 + bx, -55);
      ctx.quadraticCurveTo(-35, -45, -75, -5);
      ctx.quadraticCurveTo(-60, -15, -48, -25);
      ctx.quadraticCurveTo(-65, -5, -70, 18);
      ctx.quadraticCurveTo(-55, 5, -35, -15);
      ctx.quadraticCurveTo(-15, -35, -4 + bx, -45);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Right bangs
      ctx.beginPath();
      ctx.moveTo(6 + bx, -55);
      ctx.quadraticCurveTo(35, -45, 75, -5);
      ctx.quadraticCurveTo(60, -15, 48, -25);
      ctx.quadraticCurveTo(65, -5, 70, 18);
      ctx.quadraticCurveTo(55, 5, 35, -15);
      ctx.quadraticCurveTo(15, -35, 4 + bx, -45);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // (F) Huge Fluffy Cream Scarf (Wrapped snugly under chin)
      ctx.fillStyle = '#fbf7ee';
      ctx.strokeStyle = '#382e27';
      ctx.lineWidth = 5;

      // Scarf fluffy donut collar
      ctx.beginPath();
      ctx.roundRect(-85 + bx, 48, 170, 68, 34);
      ctx.fill();
      ctx.stroke();

      // Scarf folds
      ctx.strokeStyle = '#d4c8b6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-45 + bx, 65); ctx.lineTo(-15 + bx, 90);
      ctx.moveTo(0 + bx, 60); ctx.lineTo(25 + bx, 92);
      ctx.moveTo(35 + bx, 65); ctx.lineTo(60 + bx, 88);
      ctx.stroke();

      // Draping scarf tail on chest
      ctx.fillStyle = '#fbf7ee';
      ctx.strokeStyle = '#382e27';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.roundRect(10 + bx, 95, 55, 95, 16);
      ctx.fill();
      ctx.stroke();

      // Scarf fringe tassels
      ctx.strokeStyle = '#ad9e87';
      ctx.lineWidth = 2.5;
      for (let f = 16; f <= 60; f += 7) {
        ctx.beginPath();
        ctx.moveTo(f + bx, 190);
        ctx.lineTo(f + bx, 202);
        ctx.stroke();
      }

      ctx.restore();
      ctx.restore();
    }

    // --- CHARACTER 2: CLAUDE (High-Appeal Cel Mascot) ---
    // Warm rich terracotta (#D97757), adorable curious eyes with pupils, golden sparkle crest, animated hands
    function drawClaude(x, y, t, isSpeaking) {
      ctx.save();
      ctx.translate(x, y);

      const [bx, by] = boil(2, t);
      const bob = Math.sin(t * 15) * (isSpeaking ? 6 : 1.8);
      const tilt = isSpeaking ? Math.sin(t * 3) * 0.08 : 0.05;

      // Seated terracotta mascot
      ctx.fillStyle = '#d97757'; // Signature Claude Terracotta
      ctx.strokeStyle = '#2a140d';
      ctx.lineWidth = 6;

      // 1. Cute plump terracotta body
      ctx.beginPath();
      ctx.ellipse(0 + bx, 80 + bob * 0.3, 110, 95, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Darker shading tone under body
      ctx.fillStyle = 'rgba(170, 70, 40, 0.3)';
      ctx.beginPath();
      ctx.ellipse(0 + bx, 130, 90, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cute seated feet resting forward
      ctx.fillStyle = '#ba5738';
      ctx.beginPath();
      ctx.ellipse(-50 + bx, 155, 28, 20, -0.15, 0, Math.PI * 2);
      ctx.ellipse(50 + bx, 155, 28, 20, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Expressive arms / hands
      const armWave = isSpeaking ? Math.sin(t * 8) * 18 : 0;
      ctx.fillStyle = '#d97757';
      // Left arm (gesturing when speaking)
      ctx.beginPath();
      ctx.roundRect(-125 + bx, 40 - armWave, 38, 75, 18);
      ctx.fill();
      ctx.stroke();
      // Right arm
      ctx.beginPath();
      ctx.roundRect(85 + bx, 50 + armWave * 0.5, 38, 75, 18);
      ctx.fill();
      ctx.stroke();

      // 2. Head with curious tilt
      ctx.save();
      ctx.translate(0 + bx, -40 + bob);
      ctx.rotate(tilt);

      // Rounded bean / sphere head
      ctx.fillStyle = '#d97757';
      ctx.beginPath();
      ctx.ellipse(0, 0, 95, 88, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Cheek blush
      ctx.fillStyle = 'rgba(255, 140, 90, 0.5)';
      ctx.beginPath();
      ctx.ellipse(-55, 20, 22, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(55, 20, 22, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Big warm curious eyes
      const blink = Math.sin(t * 2.8) > 0.95;
      if (!blink) {
        // Eye whites
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-38, 0, 19, 26, -0.06, 0, Math.PI * 2);
        ctx.ellipse(38, 0, 19, 26, 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a140d';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Warm dark iris & pupil
        ctx.fillStyle = '#1e110b';
        ctx.beginPath();
        ctx.ellipse(-36, 2, 12, 18, 0, 0, Math.PI * 2);
        ctx.ellipse(36, 2, 12, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute sparkling eye catchlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-40, -5, 5, 0, Math.PI * 2);
        ctx.arc(-32, 5, 2.8, 0, Math.PI * 2);
        ctx.arc(32, -5, 5, 0, Math.PI * 2);
        ctx.arc(40, 5, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Expressive curved eyebrows
        ctx.strokeStyle = '#2a140d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(-38, -26, 18, Math.PI * 1.2, Math.PI * 1.8);
        ctx.arc(38, -26, 18, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
      } else {
        // Blink
        ctx.strokeStyle = '#2a140d';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(-38, 4, 16, Math.PI * 0.15, Math.PI * 0.85);
        ctx.arc(38, 4, 16, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
      }

      // Mouth
      if (isSpeaking) {
        const mOpen = Math.abs(Math.sin(t * 15)) * 14 + 5;
        ctx.fillStyle = '#8f251c';
        ctx.beginPath();
        ctx.ellipse(0, 36, 14, mOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a140d';
        ctx.lineWidth = 3.5;
        ctx.stroke();
        // Little tongue
        ctx.fillStyle = '#f26868';
        ctx.beginPath();
        ctx.arc(0, 36 + mOpen * 0.4, 8, 0, Math.PI);
        ctx.fill();
      } else {
        // Cozy sweet smile
        ctx.strokeStyle = '#2a140d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 28, 14, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }

      // 3. Glowing Claude Spark Asterisk / Crest on Crown
      const sparkGlow = Math.sin(t * 6) * 4;
      ctx.save();
      ctx.translate(0, -96);
      ctx.fillStyle = '#fbc531';
      ctx.strokeStyle = '#7c5308';
      ctx.lineWidth = 3.5;

      // 4-pointed radiant spark
      ctx.beginPath();
      const R = 22 + sparkGlow, r = 7;
      for (let p = 0; p < 8; p++) {
        const rad = (p * Math.PI) / 4;
        const dist = p % 2 === 0 ? R : r;
        const px = Math.cos(rad) * dist, py = Math.sin(rad) * dist;
        p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore(); // Head
      ctx.restore(); // Character
    }

    // --- SUBTITLES ---
    function drawSubtitles(t) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';

      if (t >= 0.3 && t < 5.6) {
        // Teen speaking
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 80, 1660, 160, 40, 14);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 20px -apple-system, sans-serif';
        ctx.fillText('TEENAGER', W / 2, 1687);

        ctx.font = '700 32px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 12;
        ctx.fillText('"Look at the snow piling up outside! How can code', W / 2, 1740);
        ctx.fillText('even build a cozy place like this out of nowhere?"', W / 2, 1785);
      } else if (t >= 5.8 && t < 15.6) {
        // Claude speaking
        ctx.fillStyle = '#d97757';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 70, 1660, 140, 40, 14);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 20px -apple-system, sans-serif';
        ctx.fillText('CLAUDE', W / 2, 1687);

        ctx.font = '700 32px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 12;
        ctx.fillText('"Isn\'t it fascinating? Every warm spark from the chimney', W / 2, 1740);
        ctx.fillText('and drifting snowflake is just physics and geometry."', W / 2, 1785);
      }
      ctx.restore();
    }

    // Main render function callable from node / puppeteer
    window.renderFrame = function(frameIndex) {
      const t = frameIndex / 24.0;
      ctx.clearRect(0, 0, W, H);

      // 1. Background
      drawLivingRoom(t);

      // 2. Characters
      const teenSpeaking = (t >= 0.3 && t < 5.6);
      const claudeSpeaking = (t >= 5.8 && t < 15.5);

      drawTeenager(420, 920, t, teenSpeaking);
      drawClaude(680, 940, t, claudeSpeaking);

      // 3. Subtitles
      drawSubtitles(t);
    };

    // Initial render
    window.renderFrame(30);
  </script>
</body>
</html>
