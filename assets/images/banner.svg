<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0910"/>
      <stop offset="45%" stop-color="#14111D"/>
      <stop offset="100%" stop-color="#08070C"/>
    </linearGradient>
    <radialGradient id="claudeWarm" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#B55B3E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyberPurple" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="480" fill="url(#bgCanvas)"/>
  <rect width="1200" height="480" fill="url(#claudeWarm)"/>
  <rect width="1200" height="480" fill="url(#cyberPurple)"/>

  <!-- Matrix / Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="840" y1="0" x2="840" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>
    <line x1="1080" y1="0" x2="1080" y2="480"/>
  </g>

  <!-- Ambient Waveforms (Audio Spine) -->
  <g opacity="0.22" stroke="#D97757" stroke-width="2" fill="none">
    <path d="M 60 215 Q 120 180, 180 215 T 300 215 T 420 215 T 540 215 T 660 215 T 780 215 T 900 215 T 1020 215 T 1140 215"/>
    <path d="M 60 215 Q 120 150, 180 215 T 300 215 T 420 215 T 540 215 T 660 215 T 780 215 T 900 215 T 1020 215 T 1140 215" stroke="#A78BFA" opacity="0.6"/>
  </g>

  <!-- Top System Badge -->
  <g transform="translate(60, 42)">
    <rect width="280" height="30" rx="15" fill="#1C1826" stroke="#3D324A" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#D97757"/>
    <text x="32" y="19" fill="#E2DCED" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1.5">CLAUDE CODE • VIDEO SUITE</text>
  </g>

  <!-- Release Tag Badge (Right) -->
  <g transform="translate(940, 42)">
    <rect width="200" height="30" rx="6" fill="#181422" stroke="#2D253B" stroke-width="1"/>
    <text x="100" y="19" fill="#A89FB8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">v1.0.0 • PRODUCTION</text>
  </g>

  <!-- Main Title & One-Liner -->
  <text x="60" y="132" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">claude-video-playbook</text>
  <text x="60" y="170" fill="#B4A9C7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="400">Autonomous Code-First AI Video Generation, Motion Graphics &amp; Papercraft Pipelines</text>

  <!-- 4-Stage Architectural Pipeline Track -->
  <g transform="translate(60, 222)">
    <!-- Stage 01 -->
    <rect x="0" y="0" width="248" height="88" rx="10" fill="url(#glassCard)" stroke="#2F273E" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0, 10 0 L 238 0 Q 248 0, 248 10 L 248 14 L 0 14 Z" fill="#D97757" opacity="0.8"/>
    <text x="18" y="38" fill="#D97757" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="0.5">01 • SCRIPT &amp; PROMPT</text>
    <text x="18" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Story &amp; Scene Beats</text>
    <text x="18" y="74" fill="#8E85A2" font-family="'Inter', sans-serif" font-size="11.5">Claude Code Story Engine</text>

    <!-- Connector 1-2 -->
    <path d="M 258 44 L 270 44 M 266 39 L 271 44 L 266 49" stroke="#6D5B8A" stroke-width="2" fill="none"/>

    <!-- Stage 02 -->
    <rect x="280" y="0" width="248" height="88" rx="10" fill="url(#glassCard)" stroke="#2F273E" stroke-width="1.5"/>
    <path d="M 280 10 Q 280 0, 290 0 L 518 0 Q 528 0, 528 10 L 528 14 L 280 14 Z" fill="#F5C542" opacity="0.8"/>
    <text x="298" y="38" fill="#F5C542" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="0.5">02 • SPOKEN SPINE</text>
    <text x="298" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">ElevenLabs &amp; Neural TTS</text>
    <text x="298" y="74" fill="#8E85A2" font-family="'Inter', sans-serif" font-size="11.5">Word Timings Drive Visuals</text>

    <!-- Connector 2-3 -->
    <path d="M 538 44 L 550 44 M 546 39 L 551 44 L 546 49" stroke="#6D5B8A" stroke-width="2" fill="none"/>

    <!-- Stage 03 -->
    <rect x="560" y="0" width="248" height="88" rx="10" fill="url(#glassCard)" stroke="#2F273E" stroke-width="1.5"/>
    <path d="M 560 10 Q 560 0, 570 0 L 798 0 Q 808 0, 808 10 L 808 14 L 560 14 Z" fill="#38BDF8" opacity="0.8"/>
    <text x="578" y="38" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="0.5">03 • ANIMATION CODE</text>
    <text x="578" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Remotion React &amp; GSAP</text>
    <text x="578" y="74" fill="#8E85A2" font-family="'Inter', sans-serif" font-size="11.5">3D Parallax &amp; Paper Shadows</text>

    <!-- Connector 3-4 -->
    <path d="M 818 44 L 830 44 M 826 39 L 831 44 L 826 49" stroke="#6D5B8A" stroke-width="2" fill="none"/>

    <!-- Stage 04 -->
    <rect x="840" y="0" width="240" height="88" rx="10" fill="url(#glassCard)" stroke="#2F273E" stroke-width="1.5"/>
    <path d="M 840 10 Q 840 0, 850 0 L 1070 0 Q 1080 0, 1080 10 L 1080 14 L 840 14 Z" fill="#10B981" opacity="0.8"/>
    <text x="858" y="38" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="0.5">04 • HEADLESS MUX</text>
    <text x="858" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Chromium &amp; FFmpeg</text>
    <text x="858" y="74" fill="#8E85A2" font-family="'Inter', sans-serif" font-size="11.5">Ducked Foley Audio • -14 LUFS</text>
  </g>

  <!-- Capability Pills & Stack Bar -->
  <g transform="translate(60, 350)">
    <rect width="1080" height="66" rx="8" fill="#100D18" stroke="#251D30" stroke-width="1.2"/>
    <text x="24" y="28" fill="#7C7094" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">INTEGRATED SKILLS &amp; ENGINES</text>
    
    <!-- Pills -->
    <g transform="translate(24, 38)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="20" rx="4" fill="#241C2E"/>
      <text x="69" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">papercut-video</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="124" height="20" rx="4" fill="#241C2E"/>
      <text x="208" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">bang-motion</text>

      <!-- Pill 3 -->
      <rect x="278" y="0" width="128" height="20" rx="4" fill="#241C2E"/>
      <text x="342" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">vox-explainer</text>

      <!-- Pill 4 -->
      <rect x="414" y="0" width="156" height="20" rx="4" fill="#241C2E"/>
      <text x="492" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">huashu-art-motion</text>

      <!-- Pill 5 -->
      <rect x="578" y="0" width="144" height="20" rx="4" fill="#241C2E"/>
      <text x="650" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">claude-drawing</text>

      <!-- Pill 6 -->
      <rect x="730" y="0" width="168" height="20" rx="4" fill="#241C2E"/>
      <text x="814" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">700+ opus-prompts</text>

      <!-- Pill 7 -->
      <rect x="906" y="0" width="134" height="20" rx="4" fill="#241C2E"/>
      <text x="973" y="14" fill="#E2DCED" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">elevenlabs-tts</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="476" width="1200" height="4" fill="url(#accentBorder)"/>
</svg>
