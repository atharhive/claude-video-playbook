<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cozy 3D Living Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
    #subtitles {
      position: absolute;
      bottom: 120px;
      left: 10%;
      right: 10%;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 4px 12px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
      line-height: 1.4;
      pointer-events: none;
      z-index: 100;
    }
    .speaker-pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .spk-teen { background: #3B82F6; color: #FFF; }
    .spk-claude { background: #D97757; color: #FFF; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="subtitles"></div>

  <script>
    const W = 1080, H = 1920;
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x16121e, 0.035);

    const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
    camera.position.set(0, 2.2, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    window.renderer = renderer;
    window.scene = scene;
    window.camera = camera;
    renderer.setSize(W, H);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x2d2538, 0.9);
    scene.add(ambientLight);

    // Warm fireplace point light with flicker
    const fireLight = new THREE.PointLight(0xff7722, 2.8, 8, 1.8);
    fireLight.position.set(-2.2, 1.2, -0.6);
    fireLight.castShadow = true;
    fireLight.shadow.mapSize.width = 1024;
    fireLight.shadow.mapSize.height = 1024;
    scene.add(fireLight);

    // Soft cool moonlight through window
    const moonLight = new THREE.DirectionalLight(0x88bbff, 1.2);
    moonLight.position.set(3.5, 4, -2.5);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // Warm cozy lamp fill
    const lampLight = new THREE.PointLight(0xffcc88, 1.1, 6);
    lampLight.position.set(2.4, 2.6, 0.5);
    scene.add(lampLight);

    // --- ROOM INTERIOR ---
    // Floor: warm wood planks
    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x422d1d, roughness: 0.6, metalness: 0.05 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Cozy Rug
    const rugGeo = new THREE.CylinderGeometry(1.9, 1.9, 0.02, 32);
    const rugMat = new THREE.MeshStandardMaterial({ color: 0xb5a48b, roughness: 0.95 });
    const rug = new THREE.Mesh(rugGeo, rugMat);
    rug.position.set(0, 0.01, 0.3);
    rug.receiveShadow = true;
    scene.add(rug);

    // Back Wall
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x231d2c, roughness: 0.85 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), wallMat);
    backWall.position.set(0, 3, -3.2);
    backWall.receiveShadow = true;
    scene.add(backWall);

    // --- WINDOW & SNOWFALL ---
    // Large Window Frame on Right Wall
    const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x181420, roughness: 0.7 });
    const winGroup = new THREE.Group();
    winGroup.position.set(2.2, 2.6, -3.15);
    const winBorder = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.6, 0.1), windowFrameMat);
    const winGlass = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.4), new THREE.MeshPhysicalMaterial({
      color: 0x091428, transmission: 0.6, roughness: 0.1, transparent: true, opacity: 0.9
    }));
    winGroup.add(winBorder);
    winGroup.add(winGlass);
    // Window mullions (cross bars)
    const barV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.4, 0.12), windowFrameMat);
    const barH = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.12), windowFrameMat);
    winGroup.add(barV); winGroup.add(barH);
    scene.add(winGroup);

    // Falling Snow Particles outside window
    const snowCount = 400;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(snowCount * 3);
    for (let i = 0; i < snowCount; i++) {
      snowPos[i * 3] = 1.0 + Math.random() * 2.8;
      snowPos[i * 3 + 1] = 1.0 + Math.random() * 4.0;
      snowPos[i * 3 + 2] = -3.4 - Math.random() * 2.5;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    const snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.045, transparent: true, opacity: 0.85 });
    const snowPoints = new THREE.Points(snowGeo, snowMat);
    scene.add(snowPoints);

    // --- FIREPLACE & CHIMNEY (LEFT) ---
    const chimneyGroup = new THREE.Group();
    chimneyGroup.position.set(-2.4, 0, -1.2);
    chimneyGroup.rotation.y = Math.PI / 4;

    // Stone Mantel
    const brickMat = new THREE.MeshStandardMaterial({ color: 0x5a483e, roughness: 0.9 });
    const stoneMantel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 0.8), brickMat);
    stoneMantel.position.y = 1.4;
    stoneMantel.castShadow = stoneMantel.receiveShadow = true;
    chimneyGroup.add(stoneMantel);

    // Fireplace Cavity
    const cavityMat = new THREE.MeshStandardMaterial({ color: 0x120d14, roughness: 0.95 });
    const cavity = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.5), cavityMat);
    cavity.position.set(0, 0.65, 0.2);
    chimneyGroup.add(cavity);

    // Fire logs
    const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1c11, roughness: 0.9 });
    for (let i = -1; i <= 1; i++) {
      const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), logMat);
      log.rotation.z = Math.PI / 2;
      log.rotation.y = i * 0.3;
      log.position.set(i * 0.1, 0.35, 0.2);
      chimneyGroup.add(log);
    }

    // Glowing Coals & Fire Flames
    const fireMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 1), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
    fireMesh.position.set(0, 0.5, 0.2);
    chimneyGroup.add(fireMesh);

    scene.add(chimneyGroup);

    // --- SOFA (COUCH) ---
    const sofaGroup = new THREE.Group();
    sofaGroup.position.set(0, 0, 0);

    const sofaMat = new THREE.MeshStandardMaterial({ color: 0x2a384b, roughness: 0.85 }); // Warm deep slate velvet
    const cushionMat = new THREE.MeshStandardMaterial({ color: 0x33455c, roughness: 0.8 });

    // Seat base
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.45, 1.2), sofaMat);
    sofaBase.position.y = 0.45 / 2 + 0.12;
    sofaBase.castShadow = sofaBase.receiveShadow = true;
    sofaGroup.add(sofaBase);

    // Cushions
    const seatL = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.22, 1.05), cushionMat);
    seatL.position.set(-0.65, 0.45 + 0.11, 0.02);
    seatL.castShadow = seatL.receiveShadow = true;
    sofaGroup.add(seatL);

    const seatR = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.22, 1.05), cushionMat);
    seatR.position.set(0.65, 0.45 + 0.11, 0.02);
    seatR.castShadow = seatR.receiveShadow = true;
    sofaGroup.add(seatR);

    // Backrest
    const backRest = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.95, 0.32), sofaMat);
    backRest.position.set(0, 0.9, -0.48);
    backRest.castShadow = backRest.receiveShadow = true;
    sofaGroup.add(backRest);

    // Armrests
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.65, 1.2), sofaMat);
    armL.position.set(-1.42, 0.65, 0);
    armL.castShadow = armL.receiveShadow = true;
    sofaGroup.add(armL);

    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.65, 1.2), sofaMat);
    armR.position.set(1.42, 0.65, 0);
    armR.castShadow = armR.receiveShadow = true;
    sofaGroup.add(armR);

    // Sofa legs
    const legMat = new THREE.MeshStandardMaterial({ color: 0x1f140d, roughness: 0.6 });
    [[-1.25, -0.45], [1.25, -0.45], [-1.25, 0.45], [1.25, 0.45]].forEach(([lx, lz]) => {
      const sleg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.15, 8), legMat);
      sleg.position.set(lx, 0.075, lz);
      sofaGroup.add(sleg);
    });

    scene.add(sofaGroup);

    // --- CHARACTER 1: TEENAGER (From Pinterest Ref) ---
    // Pale skin, black parted fringe, huge fluffy cream scarf hiding chin, deep navy coat
    const teenGroup = new THREE.Group();
    teenGroup.position.set(-0.65, 0.65, 0.08); // Sitting on left cushion

    // Body / Coat (Deep navy winter jacket)
    const coatMat = new THREE.MeshStandardMaterial({ color: 0x192841, roughness: 0.8 });
    const coatTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.72, 16), coatMat);
    coatTorso.position.y = 0.36;
    coatTorso.castShadow = true;
    teenGroup.add(coatTorso);

    // Sitting Legs
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x141a24, roughness: 0.85 });
    const legLT = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.48), pantsMat);
    legLT.position.set(-0.14, 0.12, 0.28);
    const legRT = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.48), pantsMat);
    legRT.position.set(0.14, 0.12, 0.28);
    teenGroup.add(legLT); teenGroup.add(legRT);

    // Head Group
    const teenHeadGroup = new THREE.Group();
    teenHeadGroup.position.set(0, 0.82, 0.02);

    // Pale Face
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xfdecd8, roughness: 0.65 });
    const faceMesh = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 20), skinMat);
    teenHeadGroup.add(faceMesh);

    // Cute Black Dot Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x151515 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), eyeMat);
    eyeL.position.set(-0.09, 0.03, 0.23);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), eyeMat);
    eyeR.position.set(0.09, 0.03, 0.23);
    teenHeadGroup.add(eyeL); teenHeadGroup.add(eyeR);

    // Pink Blush Cheeks (signature from reference)
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xf5928a, transparent: true, opacity: 0.85 });
    const blushL = new THREE.Mesh(new THREE.CircleGeometry(0.045, 16), blushMat);
    blushL.position.set(-0.14, -0.02, 0.245);
    const blushR = new THREE.Mesh(new THREE.CircleGeometry(0.045, 16), blushMat);
    blushR.position.set(0.14, -0.02, 0.245);
    teenHeadGroup.add(blushL); teenHeadGroup.add(blushR);

    // Thick Black Wavy Hair with Parted Curtains
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x18181c, roughness: 0.75 });
    const hairCrown = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), hairMat);
    hairCrown.position.set(0, 0.08, -0.02);
    teenHeadGroup.add(hairCrown);
    // Parted fringe tufts
    const bangL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 0.26, 8), hairMat);
    bangL.rotation.z = 0.45; bangL.rotation.x = -0.25;
    bangL.position.set(-0.14, 0.14, 0.22);
    const bangR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 0.26, 8), hairMat);
    bangR.rotation.z = -0.45; bangR.rotation.x = -0.25;
    bangR.position.set(0.14, 0.14, 0.22);
    teenHeadGroup.add(bangL); teenHeadGroup.add(bangR);

    // Fluffy Off-White / Cream Scarf wrapped snugly around neck & mouth
    const scarfMat = new THREE.MeshStandardMaterial({ color: 0xf6f2e8, roughness: 0.95 });
    const scarfRing = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.13, 14, 24), scarfMat);
    scarfRing.rotation.x = Math.PI / 2;
    scarfRing.position.set(0, -0.10, 0.06);
    teenHeadGroup.add(scarfRing);

    // Draping scarf tail on chest
    const scarfTail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.38, 0.08), scarfMat);
    scarfTail.position.set(0.12, -0.28, 0.22);
    scarfTail.rotation.z = -0.08;
    teenHeadGroup.add(scarfTail);

    teenGroup.add(teenHeadGroup);

    // Arms
    const armLT = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.48, 12), coatMat);
    armLT.position.set(-0.35, 0.36, 0.1);
    armLT.rotation.z = 0.35;
    teenGroup.add(armLT);

    const armRT = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.48, 12), coatMat);
    armRT.position.set(0.35, 0.36, 0.1);
    armRT.rotation.z = -0.35;
    teenGroup.add(armRT);

    scene.add(teenGroup);

    // --- CHARACTER 2: CLAUDE (Sitting beside on right cushion) ---
    // Warm terracotta ceramic/clay mascot with inquisitive antenna & spark badge
    const claudeGroup = new THREE.Group();
    claudeGroup.position.set(0.65, 0.65, 0.08);

    const claudeMat = new THREE.MeshStandardMaterial({ color: 0xd97757, roughness: 0.5, metalness: 0.05 });
    const claudeLoMat = new THREE.MeshStandardMaterial({ color: 0xb55b3e, roughness: 0.6 });

    // Round cute chibi body
    const claudeBody = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 20), claudeMat);
    claudeBody.position.y = 0.40;
    claudeBody.scale.set(1.05, 0.95, 1);
    claudeBody.castShadow = true;
    claudeGroup.add(claudeBody);

    // Claude Head Group (curious tilt)
    const claudeHeadGroup = new THREE.Group();
    claudeHeadGroup.position.set(0, 0.85, 0.02);

    const claudeHead = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 20), claudeMat);
    claudeHead.castShadow = true;
    claudeHeadGroup.add(claudeHead);

    // Gentle vertical curious eyes
    const cEyeL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.04), eyeMat);
    cEyeL.position.set(-0.11, 0.02, 0.32);
    const cEyeR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.04), eyeMat);
    cEyeR.position.set(0.11, 0.02, 0.32);
    claudeHeadGroup.add(cEyeL); claudeHeadGroup.add(cEyeR);

    // Soft warm blush
    const cBlushL = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), blushMat);
    cBlushL.position.set(-0.18, -0.06, 0.31);
    const cBlushR = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), blushMat);
    cBlushR.position.set(0.18, -0.06, 0.31);
    claudeHeadGroup.add(cBlushL); claudeHeadGroup.add(cBlushR);

    // Glowing Claude Spark Asterisk / Crest on forehead
    const sparkMat = new THREE.MeshBasicMaterial({ color: 0xf5c542 });
    const sparkCenter = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), sparkMat);
    sparkCenter.position.set(0, 0.28, 0.26);
    claudeHeadGroup.add(sparkCenter);

    // 4 cute pendant legs resting on cushion
    [[-0.18, 0.18], [-0.06, 0.22], [0.06, 0.22], [0.18, 0.18]].forEach(([cx, cz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.32, 10), claudeLoMat);
      leg.position.set(cx, 0.16, cz);
      claudeGroup.add(leg);
    });

    // Articulated Arms
    const cArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.36, 10), claudeMat);
    cArmL.position.set(-0.36, 0.42, 0.08);
    cArmL.rotation.z = 0.45;
    claudeGroup.add(cArmL);

    const cArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.36, 10), claudeMat);
    cArmR.position.set(0.36, 0.42, 0.08);
    cArmR.rotation.z = -0.45;
    claudeGroup.add(cArmR);

    claudeGroup.add(claudeHeadGroup);
    scene.add(claudeGroup);

    // --- COFFEE TABLE & MUG ---
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.5 });
    const table = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.04, 24), tableMat);
    table.position.set(0, 0.38, 1.4);
    table.castShadow = table.receiveShadow = true;
    const tLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.38, 12), tableMat);
    tLeg.position.set(0, 0.19, 1.4);
    scene.add(table); scene.add(tLeg);

    // Steaming mug on table
    const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xeee8dd }));
    mug.position.set(0.15, 0.45, 1.35);
    scene.add(mug);

    // --- DIALOGUE TIMELINE & ANIMATION ---
    const subEl = document.getElementById('subtitles');

    window.READY = true;
    window.render = function(t) {
      // 1. Snowfall loop
      const positions = snowPoints.geometry.attributes.position.array;
      for (let i = 0; i < snowCount; i++) {
        let y = positions[i * 3 + 1] - 0.015;
        if (y < 0.2) y = 4.2;
        positions[i * 3 + 1] = y;
        // subtle wind drift
        positions[i * 3] += Math.sin(t * 1.5 + i) * 0.002;
      }
      snowPoints.geometry.attributes.position.needsUpdate = true;

      // 2. Fireplace flicker
      const flicker = Math.sin(t * 18) * 0.3 + Math.cos(t * 27) * 0.2;
      fireLight.intensity = 2.8 + flicker;
      fireMesh.scale.setScalar(1 + flicker * 0.15);

      // 3. Camera subtle cinematic push
      camera.position.z = 5.8 - Math.min(t * 0.035, 0.6);
      camera.position.y = 2.2 + Math.sin(t * 0.5) * 0.03;

      // 4. Teenager gestures & head bob
      if (t < 5.8) {
        // Teen speaking
        const teenSpeaking = Math.sin(t * 12);
        teenHeadGroup.rotation.y = Math.sin(t * 1.5) * 0.18 + 0.12; // Looking slightly toward window & Claude
        teenHeadGroup.rotation.x = teenSpeaking * 0.04;
        armLT.rotation.z = 0.35 + Math.sin(t * 4) * 0.12; // expressive hand
        // Claude listening attentively
        claudeHeadGroup.rotation.y = -0.28; // Turned listening to teen
        claudeHeadGroup.rotation.z = 0.08;  // Curious head tilt
        claudeHeadGroup.rotation.x = Math.sin(t * 2) * 0.03;
      } else {
        // Claude speaking
        const claudeSpeaking = Math.sin(t * 14);
        claudeHeadGroup.rotation.y = -0.22 + Math.sin(t * 1.8) * 0.14;
        claudeHeadGroup.rotation.x = claudeSpeaking * 0.05;
        claudeHeadGroup.rotation.z = 0.12 + Math.cos(t * 2) * 0.04;
        cArmL.rotation.z = 0.45 + Math.sin(t * 5) * 0.15; // Claude gestures
        // Teen listening
        teenHeadGroup.rotation.y = 0.28; // Turned to Claude
        teenHeadGroup.rotation.x = 0;
      }

      // 5. Subtitles synchronized to master dialogue
      if (t >= 0.3 && t < 5.6) {
        subEl.innerHTML = '<span class="speaker-pill spk-teen">TEENAGER</span><br>"Look at the snow piling up outside! How can code even build a cozy place like this out of nowhere?"';
      } else if (t >= 5.8 && t < 15.6) {
        subEl.innerHTML = '<span class="speaker-pill spk-claude">CLAUDE</span><br>"Isn\'t it fascinating? Every warm spark from the chimney and every drifting snowflake is just physics, light, and geometry speaking together."';
      } else {
        subEl.innerHTML = '';
      }

      window.renderer.render(window.scene, window.camera);
    };

    // Initial render
    window.render(0);
  </script>
</body>
</html>
